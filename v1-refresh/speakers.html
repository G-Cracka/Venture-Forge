<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speakers — Venture-Forge Summit Austin 2026</title>
  <meta name="description" content="Founders, investors, and leaders gathering in Austin on September 23–24, 2026.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Fira+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <section class="page-hero">
    <div class="grid-lines"></div><div class="glow"></div>
    <div class="wrap">
      <p class="eyebrow">2026 Lineup</p>
      <h1><span class="line"><span><em>Speakers</em></span></span></h1>
      <p class="lede">Founders, investors, and leaders gathering in Austin on September 23–24, 2026 to forge what's next for the Kingdom economy.</p>
    </div>
  </section>

  <section class="sec" style="padding-top:2rem">
    <div class="wrap"><div class="speaker-grid" data-render="speakers-grid"></div></div>
  </section>

  <section class="sec light cut-top">
    <div class="wrap">
      <div class="sec-head"><div><p class="eyebrow">Founders Showcase</p><h2 data-split>Kingdom-minded companies <em>on day two.</em></h2></div></div>
      <div class="showcase-cards" data-render="showcase-cards"></div>
    </div>
  </section>

  <section class="sec join">
    <div class="bg"><img src="../assets/img/photos/summit.jpg" alt="" loading="lazy"></div>
    <canvas class="embers" data-density="0.5"></canvas>
    <div class="wrap">
      <h2 data-split>Join them in <em>Austin.</em></h2>
      <p class="lede" data-reveal>September 23–24, 2026 at Riverbend Centre.</p>
      <div class="btn-row" data-reveal><a class="btn" data-href="register" target="_blank" rel="noopener">Register <span class="arr">→</span></a></div>
    </div>
  </section>
</main>
<script src="../assets/js/data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
